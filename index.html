<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alchemy Festival — Live</title>
<style>
  html,body{ margin:0; padding:0; background:#fff; }
/* ALCHEMY FESTIVAL — LIVE PAGE :: CSS block */

.afl-wrap { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color:#1a1a1a; line-height:1.5; max-width:820px; margin:0 auto; padding:20px 16px 60px; box-sizing:border-box; }
.afl-wrap *, .afl-wrap *::before, .afl-wrap *::after { box-sizing:border-box; }

/* Status bar */
.afl-status { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14px; font-weight:700; color:#555; margin-bottom:16px; flex-wrap:wrap; }
.afl-live { display:inline-flex; align-items:center; gap:7px; color:#FF3D2E; text-transform:uppercase; letter-spacing:0.08em; }
.afl-live .pulse { width:9px; height:9px; border-radius:50%; background:#FF3D2E; animation:aflpulse 1.6s infinite; }
@keyframes aflpulse { 0%{opacity:1;transform:scale(1);} 50%{opacity:0.35;transform:scale(0.8);} 100%{opacity:1;transform:scale(1);} }
.afl-clock { font-variant-numeric:tabular-nums; }

/* NOW hero */
.afl-now { background:#FF3D2E; color:#fff; border-radius:18px; padding:30px 26px; margin-bottom:14px; }
.afl-now .kicker { font-size:13px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; opacity:0.9; margin:0 0 10px; }
.afl-now h1 { font-size:clamp(30px,7vw,52px); font-weight:900; line-height:1.0; margin:0 0 12px; letter-spacing:-0.01em; }
.afl-now .meta { font-size:15px; font-weight:600; opacity:0.95; }
.afl-now .sw-names { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.afl-now .sw-names span { background:rgba(255,255,255,0.22); padding:5px 13px; border-radius:999px; font-weight:800; font-size:16px; }
.afl-now.change { background:#2EC4B6; color:#0c3d38; }
.afl-now.doors  { background:#FFD23F; color:#1a1a1a; }
.afl-now.wrap   { background:#1a1a1a; color:#fff; }

/* NEXT */
.afl-next { background:#FFF8E7; border:3px solid #1a1a1a; border-radius:14px; padding:14px 20px; margin-bottom:26px; font-size:16px; font-weight:700; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.afl-next .lbl { font-size:12px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:#FF3D2E; }
.afl-next .nx-time { background:#1a1a1a; color:#fff; padding:3px 11px; border-radius:999px; font-size:14px; }

/* All-day strip */
.afl-allday { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:30px; }
.afl-tile { border:3px solid #1a1a1a; border-radius:12px; padding:14px 16px; background:#fff; }
.afl-tile .t-name { font-weight:800; font-size:15px; }
.afl-tile .t-venue { font-size:12px; color:#777; margin-top:2px; }
.afl-tile .t-state { display:inline-block; margin-top:8px; font-size:12px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; padding:4px 10px; border-radius:999px; }
.afl-tile .t-state.on   { background:#2EC4B6; color:#08322e; }
.afl-tile .t-state.open { background:#FFD23F; color:#1a1a1a; }
.afl-tile .t-state.off  { background:#eee; color:#999; }

/* Section heads */
.afl-h2 { font-size:22px; font-weight:900; text-transform:uppercase; letter-spacing:-0.01em; margin:0 0 4px; }
.afl-sub { font-size:14px; color:#777; margin:0 0 16px; }

/* Running order */
.afl-run { display:flex; flex-direction:column; gap:11px; }
.afl-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:10px 0 4px; }
.afl-head .tag { background:#FF3D2E; color:#fff; font-weight:800; font-size:12px; letter-spacing:0.04em; padding:5px 12px; border-radius:999px; text-transform:uppercase; }
.afl-head .venue { font-size:13px; font-weight:700; color:#FF3D2E; letter-spacing:0.03em; text-transform:uppercase; }

.afl-row { display:flex; align-items:center; gap:14px; background:#fff; border:3px solid #1a1a1a; border-radius:13px; padding:14px 18px; transition:opacity .3s, box-shadow .3s, transform .3s; }
.afl-row .time { flex:0 0 auto; min-width:60px; font-weight:800; font-size:15px; }
.afl-row .dot { flex:0 0 auto; width:11px; height:11px; border-radius:50%; }
.afl-row .dot.coral{background:#FF3D2E;} .afl-row .dot.yellow{background:#FFD23F;} .afl-row .dot.teal{background:#2EC4B6;}
.afl-row .nm { font-weight:800; font-size:17px; line-height:1.15; }
.afl-row.finale { background:#1a1a1a; color:#fff; }

/* Spoken word banner */
.afl-sw { background:#2EC4B6; border:3px solid #1a1a1a; border-radius:13px; padding:16px 18px; transition:opacity .3s, box-shadow .3s, transform .3s; }
.afl-sw .sw-top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:9px; }
.afl-sw .sw-time { background:#1a1a1a; color:#fff; font-weight:800; font-size:12px; padding:5px 12px; border-radius:999px; }
.afl-sw .sw-lbl { font-weight:900; font-size:14px; letter-spacing:0.05em; text-transform:uppercase; color:#0c4f48; }
.afl-sw .sw-names { display:flex; flex-wrap:wrap; gap:7px; }
.afl-sw .sw-names span { background:#fff; font-weight:800; font-size:15px; padding:5px 12px; border-radius:999px; }

/* status states applied by JS */
.afl-past { opacity:0.4; }
.afl-past .nm, .afl-past .sw-names span { text-decoration:line-through; text-decoration-thickness:1px; }
.afl-current { box-shadow:0 0 0 4px #FFD23F, 0 8px 24px rgba(0,0,0,0.14); transform:scale(1.015); }
.afl-badge-now { display:inline-block; margin-left:auto; background:#FFD23F; color:#1a1a1a; font-size:11px; font-weight:900; letter-spacing:0.08em; text-transform:uppercase; padding:4px 10px; border-radius:999px; }

/* jump-to-now */
.afl-jump { position:sticky; bottom:14px; display:flex; justify-content:center; margin-top:22px; pointer-events:none; }
.afl-jump button { pointer-events:auto; background:#1a1a1a; color:#fff; border:none; font-weight:800; font-size:14px; padding:12px 22px; border-radius:999px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.25); }

/* crew panel */
.afl-crew { position:fixed; bottom:16px; right:16px; z-index:9999; background:#1a1a1a; color:#fff; border-radius:14px; padding:14px 16px; box-shadow:0 8px 30px rgba(0,0,0,0.4); font-size:13px; width:210px; }
.afl-crew h4 { margin:0 0 4px; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:#FFD23F; }
.afl-crew .off { font-variant-numeric:tabular-nums; font-weight:800; margin:6px 0 10px; }
.afl-crew .btns { display:flex; gap:8px; }
.afl-crew button { flex:1; background:#333; color:#fff; border:none; border-radius:8px; padding:10px 0; font-weight:800; font-size:15px; cursor:pointer; }
.afl-crew button.reset { background:#FF3D2E; flex:0 0 auto; padding:10px 12px; font-size:12px; }
.afl-crew button:active { transform:scale(0.95); }

@media (max-width:600px){
  .afl-now { padding:24px 20px; }
  .afl-row { padding:12px 14px; gap:11px; }
  .afl-row .time { min-width:52px; font-size:14px; }
  .afl-row .nm { font-size:15px; }
}

  .afl-msg { background:#FFD23F; color:#1a1a1a; border-radius:14px; padding:14px 20px; margin-bottom:14px; font-weight:800; font-size:16px; display:flex; align-items:center; gap:10px; }
  .afl-msg::before { content:"\1F4E3"; font-size:20px; }
</style>
</head>
<body>

<div class="afl-wrap" id="afl">
  <div class="afl-status">
    <span class="afl-live"><span class="pulse"></span> Live</span>
    <span class="afl-clock" id="afl-clock">--:--</span>
  </div>
  <div id="afl-msg" class="afl-msg" style="display:none;"></div>
  <div id="afl-now" class="afl-now"></div>
  <div id="afl-next" class="afl-next" style="display:none;"></div>
  <h2 class="afl-h2">Happening all day</h2>
  <div class="afl-allday" id="afl-allday"></div>
  <h2 class="afl-h2">Full running order</h2>
  <p class="afl-sub">Live acts in the Great Hall. Spoken Word Stage sets run between them.</p>
  <div class="afl-run" id="afl-run"></div>
  <div class="afl-jump"><button id="afl-jump-btn">↑ Jump to now</button></div>
</div>

<script>
(function(){
  var DAY_START="13:00", DAY_END="21:00";

  // ---- JSONBin (live shared state) ----
  var BIN_ID="6a4d43f1f5f4af5e296dc12c";
  var ACCESS_KEY="$2a$10$2HsvAFajNVYDrBtkyi9pze04nsD86TQtlhpOcY9BkZHGsl5QKQIlW"; // read-only, safe in page
  var STATE_URL="https://api.jsonbin.io/v3/b/"+BIN_ID+"/latest";
  var POLL_MS=25000;

  var DEFAULT_SCHEDULE=[
    {id:"s0",start:"13:00",end:"15:00",venue:"RHB 137A",type:"symposium",name:"Symposium — Alchemical Thinking",dot:"yellow"},
    {id:"s1",start:"15:00",venue:"Great Hall",type:"act",name:"DJ Jamie",dot:"coral"},
    {id:"s2",start:"16:00",end:"16:25",venue:"Great Hall",type:"sw",names:["Yaz","Leah & Arielle","Alinda"]},
    {id:"s3",start:"16:25",venue:"Great Hall",type:"act",name:"Immaculate",dot:"yellow"},
    {id:"s4",start:"16:30",venue:"Great Hall",type:"act",name:"Zack",dot:"teal"},
    {id:"s5",start:"16:35",venue:"Great Hall",type:"act",name:"Timothy",dot:"coral"},
    {id:"s6",start:"16:40",venue:"Great Hall",type:"act",name:"The Blue Brick House",dot:"yellow"},
    {id:"s7",start:"17:00",end:"17:20",venue:"Great Hall",type:"sw",names:["Angel","Joshua"]},
    {id:"s8",start:"17:25",venue:"Great Hall",type:"act",name:"Josh",dot:"teal"},
    {id:"s9",start:"17:35",venue:"Great Hall",type:"act",name:"Sautii",dot:"coral"},
    {id:"s10",start:"17:40",venue:"Great Hall",type:"act",name:"Moziah",dot:"yellow"},
    {id:"s11",start:"17:50",venue:"Great Hall",type:"act",name:"Meaningful",dot:"teal"},
    {id:"s12",start:"18:00",end:"18:15",venue:"Great Hall",type:"sw",names:["Rasheed","Quest","Zack"]},
    {id:"s13",start:"18:15",venue:"Great Hall",type:"act",name:"Quest",dot:"coral"},
    {id:"s14",start:"18:30",venue:"Great Hall",type:"act",name:"Zoe",dot:"yellow"},
    {id:"s15",start:"18:45",venue:"Great Hall",type:"act",name:"Lilac Dior",dot:"teal"},
    {id:"s16",start:"19:00",end:"19:15",venue:"Great Hall",type:"sw",names:["Rofeda"]},
    {id:"s17",start:"19:15",venue:"Great Hall",type:"act",name:"Rezon8",dot:"coral"},
    {id:"s18",start:"19:45",venue:"Great Hall",type:"act",name:"DJ Baconrasher",dot:"yellow"},
    {id:"s19",start:"20:00",end:"20:15",venue:"Great Hall",type:"sw",names:["Lilac Rose","Zoe","Yaz"]},
    {id:"s20",start:"20:15",end:"21:00",venue:"Great Hall",type:"finale",name:"UYT Collective",dot:"yellow"}
  ];
  var ALLDAY=[
    {name:"Symposium", venue:"RHB 137A", start:"13:00", end:"15:00"},
    {name:"Festival BBQ", venue:"Thirty Five Café", start:"15:00", end:"16:30", openWord:"Serving now"},
    {name:"Cinema", venue:"Goldsmiths Cinema", allday:true},
    {name:"Exhibition", venue:"Kingsway Corridor", allday:true}
  ];

  var SHARED={ offsetMinutes:0, message:"", forceActId:null, schedule:null };
  var SCHEDULE=[];

  function toMin(t){ var p=String(t).split(":"); return (+p[0])*60+(+p[1]); }
  function fmt(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60),mm=m%60,ap=h<12?"am":"pm",hh=h%12; if(hh===0)hh=12; return hh+":"+(mm<10?"0":"")+mm+ap; }
  function fmtD(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60),mm=m%60,hh=h%12; if(hh===0)hh=12; return hh+":"+(mm<10?"0":"")+mm; }
  function fmtClock(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60),mm=m%60; return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm; }
  function qs(k){ var r=new RegExp("[?&]"+k+"=([^&]+)").exec(window.location.search); return r?decodeURIComponent(r[1]):null; }

  var OFFKEY="aflOffset";
  function getLocalOffset(){ var v=parseInt(localStorage.getItem(OFFKEY)||"0",10); return isNaN(v)?0:v; }
  function setLocalOffset(v){ try{localStorage.setItem(OFFKEY,String(v));}catch(e){} }

  function nowMin(){
    var o=qs("t"),base;
    if(o && /^\d{1,2}:\d{2}$/.test(o)){ base=toMin(o); } else { var d=new Date(); base=d.getHours()*60+d.getMinutes(); }
    return base + (SHARED.offsetMinutes||0) + getLocalOffset();
  }

  function normalize(src){
    var arr=(src && src.length)? src.slice() : DEFAULT_SCHEDULE.slice();
    arr = arr.filter(function(s){ return s && s.start; });
    arr.sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
    arr.forEach(function(s){
      var range = (s.type==="sw"||s.type==="finale") && s.end;
      s._disp = range ? (fmtD(toMin(s.start))+"–"+fmtD(toMin(s.end))) : fmtD(toMin(s.start));
      if(s.type==="sw" && !Array.isArray(s.names)) s.names=String(s.name||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
    });
    return arr;
  }
  function rebuild(){ SCHEDULE=normalize(SHARED.schedule); }

  function slotEnd(i){
    if(SCHEDULE[i].end) return toMin(SCHEDULE[i].end);
    if(i+1<SCHEDULE.length) return toMin(SCHEDULE[i+1].start);
    return toMin(DAY_END);
  }
  function nameOf(s){ return s.type==="sw" ? (s.names||[]).join(", ") : s.name; }
  function idxById(id){ for(var i=0;i<SCHEDULE.length;i++){ if(SCHEDULE[i].id===id) return i; } return -1; }
  function forcedIdx(){ return SHARED.forceActId ? idxById(SHARED.forceActId) : -1; }
  function forced(){ return forcedIdx()>=0; }
  function currentIndex(n){
    var fi=forcedIdx(); if(fi>=0) return fi;
    for(var i=0;i<SCHEDULE.length;i++){ if(n>=toMin(SCHEDULE[i].start) && n<slotEnd(i)) return i; }
    return -1;
  }

  function renderMsg(){
    var el=document.getElementById("afl-msg");
    if(SHARED.message && String(SHARED.message).trim()!==""){ el.style.display="flex"; el.textContent=SHARED.message; }
    else { el.style.display="none"; }
  }
  function renderNow(){
    var n=nowMin(), el=document.getElementById("afl-now"), nx=document.getElementById("afl-next");
    el.className="afl-now";
    if(!forced() && n<toMin(DAY_START)){ el.classList.add("doors");
      el.innerHTML='<p class="kicker">Doors</p><h1>Warming up</h1><div class="meta">The festival opens at 1pm. First up: the Symposium in RHB 137A.</div>'; nx.style.display="none"; return; }
    if(!forced() && n>=toMin(DAY_END)){ el.classList.add("wrap");
      el.innerHTML='<p class="kicker">That\u2019s a wrap</p><h1>Thank you</h1><div class="meta">Thank you for being part of the first-ever Alchemy Festival. See you next time.</div>'; nx.style.display="none"; return; }
    var cur=currentIndex(n);
    if(cur===-1){ el.classList.add("change");
      el.innerHTML='<p class="kicker">\u23F1 Changeover</p><h1>Next act shortly</h1><div class="meta">Hang tight — the next performance is about to start.</div>';
    } else {
      var s=SCHEDULE[cur];
      var kicker=s.type==="symposium"?"On now · Symposium":(s.type==="sw"?"On now · Spoken Word Stage":"On now");
      var body;
      if(s.type==="sw"){ body='<h1>Spoken Word</h1><div class="sw-names">'+(s.names||[]).map(function(nm){return "<span>"+nm+"</span>";}).join("")+'</div><div class="meta" style="margin-top:10px;">'+(s.venue||"")+'</div>'; }
      else { var tail=forced()?"":" · on until "+fmt(slotEnd(cur)); body='<h1>'+s.name+'</h1><div class="meta">'+(s.venue||"")+tail+'</div>'; }
      el.innerHTML='<p class="kicker">'+kicker+'</p>'+body;
    }
    var nextSlot=null;
    if(forced()){ if(cur>=0 && cur+1<SCHEDULE.length) nextSlot=SCHEDULE[cur+1]; }
    else { for(var j=0;j<SCHEDULE.length;j++){ if(toMin(SCHEDULE[j].start)>n){ nextSlot=SCHEDULE[j]; break; } } }
    if(nextSlot){ nx.style.display="flex"; var t=forced()?nextSlot._disp:fmt(toMin(nextSlot.start));
      nx.innerHTML='<span class="lbl">Next up</span> <span>'+nameOf(nextSlot)+'</span> <span class="nx-time">'+t+'</span>'; }
    else { nx.style.display="none"; }
  }
  function renderAllday(){
    var n=nowMin(), wrap=document.getElementById("afl-allday"); wrap.innerHTML="";
    ALLDAY.forEach(function(a){
      var state,cls;
      if(a.allday){ state="Open all day"; cls="open"; }
      else if(n<toMin(a.start)){ state="From "+fmt(toMin(a.start)); cls="open"; }
      else if(n>=toMin(a.start) && n<toMin(a.end)){ state=a.openWord||"On now"; cls="on"; }
      else { state="Finished"; cls="off"; }
      wrap.innerHTML+='<div class="afl-tile"><div class="t-name">'+a.name+'</div><div class="t-venue">'+a.venue+'</div><span class="t-state '+cls+'">'+state+'</span></div>';
    });
  }
  function renderRun(){
    var n=nowMin(), wrap=document.getElementById("afl-run"); wrap.innerHTML="";
    var cur=currentIndex(n);
    SCHEDULE.forEach(function(s,i){
      var status;
      if(forced()){ status=i<cur?"past":(i===cur?"current":"up"); }
      else { status=(i<cur||n>=slotEnd(i))?"past":(i===cur?"current":"up"); }
      var nowBadge=status==="current"?'<span class="afl-badge-now">On now</span>':"";
      var node;
      if(s.type==="sw"){
        node='<div class="afl-sw '+(status==="past"?"afl-past":status==="current"?"afl-current":"")+'">'
          +'<div class="sw-top"><span class="sw-time">'+s._disp+'</span><span class="sw-lbl">Spoken Word Stage</span>'+nowBadge+'</div>'
          +'<div class="sw-names">'+(s.names||[]).map(function(nm){return "<span>"+nm+"</span>";}).join("")+'</div></div>';
      } else {
        var finale=s.type==="finale"?" finale":"";
        node='<div class="afl-row'+finale+' '+(status==="past"?"afl-past":status==="current"?"afl-current":"")+'">'
          +'<div class="time">'+s._disp+'</div><span class="dot '+(s.dot||"coral")+'"></span>'
          +'<div class="nm">'+s.name+'</div>'+nowBadge+'</div>';
      }
      wrap.innerHTML+=node;
    });
  }
  function mountCrew(){
    if(qs("crew")!=="1") return;
    var box=document.createElement("div"); box.className="afl-crew";
    function paint(){ box.querySelector(".off").textContent=(getLocalOffset()>=0?"+":"")+getLocalOffset()+" min (local)"; }
    box.innerHTML='<h4>Crew · local test nudge</h4><div class="off"></div>'
      +'<div class="btns"><button data-d="-5">\u22125</button><button data-d="5">+5</button><button class="reset" data-d="0">Reset</button></div>';
    document.getElementById("afl").appendChild(box);
    box.addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; var d=+b.getAttribute("data-d");
      setLocalOffset(d===0?0:getLocalOffset()+d); paint(); render(); });
    paint();
  }
  function render(){
    document.getElementById("afl-clock").textContent=fmtClock(nowMin());
    renderMsg(); renderNow(); renderAllday(); renderRun();
  }
  function scrollToNow(){ var c=document.querySelector(".afl-current"); if(c) c.scrollIntoView({behavior:"smooth",block:"center"}); }

  function fetchState(){
    fetch(STATE_URL+"?_="+Date.now(), { cache:"no-store", headers:{ "X-Access-Key":ACCESS_KEY, "X-Bin-Meta":"false" } })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if(j && typeof j==="object"){
          SHARED.offsetMinutes=(typeof j.offsetMinutes==="number")?j.offsetMinutes:0;
          SHARED.message=(typeof j.message==="string")?j.message:"";
          SHARED.forceActId=(typeof j.forceActId==="string")?j.forceActId:null;
          SHARED.schedule=Array.isArray(j.schedule)?j.schedule:null;
        }
        rebuild(); render();
      })
      .catch(function(){ rebuild(); render(); });
  }

  function boot(){
    rebuild();
    document.getElementById("afl-jump-btn").addEventListener("click",scrollToNow);
    mountCrew();
    render();
    fetchState();
    setTimeout(scrollToNow,500);
    // poll only while the page is actually being looked at (saves requests)
    setInterval(function(){ if(document.visibilityState==="visible") fetchState(); }, POLL_MS);
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") fetchState(); });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",boot); } else { boot(); }
})();
</script>
</body>
</html>
